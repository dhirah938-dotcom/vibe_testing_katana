    <script>
      // Prevent cross-origin third-party script errors (e.g. Disqus / adblockers) from surfacing as unhandled uncaught errors
      window.addEventListener(
        'error',
        function (e) {
          if (
            e.message === 'Script error.' ||
            (!e.filename && !e.lineno) ||
            (e.filename && (e.filename.includes('disqus') || e.filename.includes('disquscdn')))
          ) {
            e.preventDefault();
            e.stopImmediatePropagation();
            return true;
          }
        },
        true
      );
      window.addEventListener(
        'unhandledrejection',
        function (e) {
          if (
            e.reason &&
            (e.reason.message === 'Script error.' ||
              String(e.reason).includes('disqus') ||
              String(e.reason).includes('Disqus'))
          ) {
            e.preventDefault();
            e.stopImmediatePropagation();
          }
        },
        true
      );
      window.disqus_shortname = 'katana-sword-smu';
    </script>
  </head>

  </body>
